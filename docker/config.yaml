server:
  transport: "http"
  host: "0.0.0.0"
  port: 8000

llm:
  provider: "openai"
  model: "deepseek-chat"
  max_tokens: 4096
  structured_output_mode: "json_schema"
  providers:
    openai:
      api_key: "sk-f8c0ec7187b7494da884477954f6ac86"
      api_url: "https://api.deepseek.com/v1"

embedder:
  provider: "openai"
  model: "bge-small-zh-v1.5"
  dimensions: 512
  providers:
    openai:
      api_key: "local"
      api_url: "http://127.0.0.1:8100/v1"

database:
  provider: "falkordb"
  providers:
    falkordb:
      uri: "redis://localhost:6379"
      password: ""
      database: "default_db"

graphiti:
  group_id: "main"
  user_id: "hermes_user"
  entity_types:
    - name: "Preference"
      description: "User preferences, choices, opinions, or selections"
    - name: "Requirement"
      description: "Requirements, constraints, or conditions"
    - name: "Procedure"
      description: "Procedures, processes, or step-by-step instructions"
    - name: "Organization"
      description: "Organizations, teams, or groups"
    - name: "Person"
      description: "People, users, or individuals"
    - name: "Location"
      description: "Locations, places, or regions"
    - name: "Event"
      description: "Events, occurrences, or incidents"
    - name: "Document"
      description: "Documents, files, or written content"
